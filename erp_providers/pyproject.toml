[project]
name = "integration-erp-providers"
version = "0.1.0"
description = "Provider factory over ERP integrations (Odoo, …)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "odoo-read",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_providers"]
