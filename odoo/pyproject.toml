[project]
name = "odoo-read"
version = "0.1.0"
description = "Odoo JSON-RPC 2.0 client (users, projects, partners, materials)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31,<3",
]

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_read"]
