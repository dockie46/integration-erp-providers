[project]
name = "integration-erp-providers-workspace"
version = "0.1.0"
description = "ERP integration tooling (Odoo, …)"
requires-python = ">=3.11"
dependencies = [
    "integration-erp-providers",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<0.5",
]

[tool.uv]
package = false
default-groups = [
    "dev",
]

[tool.uv.workspace]
members = [
    "odoo",
    "erp_providers",
]

[tool.uv.sources]
odoo-read = { workspace = true }
integration-erp-providers = { workspace = true }

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.pytest.ini_options]
testpaths = [
    "odoo/tests",
    "erp_providers/tests",
]
pythonpath = [
    "odoo/src",
    "erp_providers/src",
]
